name: test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pip install
        uses: ./.github/workflows/composite/pip-install
      - name: Test hooks
        run: python -m unittest discover -s hooks -p "*_test.py" -v
